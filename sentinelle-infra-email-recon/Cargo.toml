[package]
name = "sentinelle-infra-email-recon"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinelle-domain = { path = "../sentinelle-domain" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trust-dns-resolver = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"
urlencoding = "2.1"