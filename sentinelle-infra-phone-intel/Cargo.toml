[package]
name = "sentinelle-infra-phone-intel"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinelle-domain = { path = "../sentinelle-domain" }
phonenumber = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"