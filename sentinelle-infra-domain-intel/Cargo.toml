[package]
name = "sentinelle-infra-domain-intel"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinelle-domain = { path = "../sentinelle-domain" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trust-dns-resolver = "0.23"
whois-rust = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
thiserror = "1"
tokio-rustls = "0.24"
rustls = "0.23"
webpki-roots = "0.26"
x509-parser = "0.16"
chrono = { version = "0.4", features = ["serde"] }