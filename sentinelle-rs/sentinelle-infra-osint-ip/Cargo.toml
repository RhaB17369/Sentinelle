[package]
name = "sentinelle-infra-osint-ip"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinelle-domain = { path = "../sentinelle-domain" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"