[package]
name = "sentinelle-infra-osint-mail"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinelle-domain = { path = "../sentinelle-domain" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"
async-trait = "0.1"
futures = "0.3"
md5 = "0.7"
futures = "0.3"
md5 = "0.7"