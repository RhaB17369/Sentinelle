[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelle"
version = "2.0.0"
description = "Pure Python Production-grade OSINT intelligence platform"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "networkx>=2.8",
    "python-whois>=0.8.0",
    "dnspython>=2.2.0",
    "phonenumbers>=8.13.0",
    "requests>=2.28.0",
    "ipwhois>=1.2.0",
    "httpx[http2]>=0.24.0",
    "trio>=0.22.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "opencage>=2.2.0",
    "cryptography>=38.0.0",
    "aiohttp>=3.9.0",
    "aiodns>=3.1.0",
    "python-dotenv>=1.1.1",
    "reportlab>=4.4.2",
    "pillow>=11.3.0",
    "beautifulsoup4>=4.12.0",
    "termcolor>=2.3.0",
    "chardet>=5.2.0"
]

[project.scripts]
sentinelle = "sentinelle.interface.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinelle.engines" = ["data/*"]
