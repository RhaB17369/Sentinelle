[package]
name = "sentinelle-infra-osint-advanced"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinelle_infra_osint_advanced"
path = "src/lib.rs"

[dependencies]
sentinelle-domain = { path = "../sentinelle-domain" }
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.20"
url = "2.5"
regex = "1.10"
base64 = "0.22"
rand = "0.8"
futures = "0.3"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }